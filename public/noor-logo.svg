<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1940"/>
      <stop offset="100%" stop-color="#0f0e2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2bc5e"/>
      <stop offset="50%" stop-color="#d4a846"/>
      <stop offset="100%" stop-color="#c9973a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#d4a846" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d4a846" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle geometric pattern -->
  <g opacity="0.06" stroke="#d4a846" stroke-width="1" fill="none">
    <path d="M256 80L432 256L256 432L80 256Z"/>
    <path d="M256 130L382 256L256 382L130 256Z"/>
    <path d="M256 180L332 256L256 332L180 256Z"/>
  </g>
  <!-- Light rays emanating upward -->
  <g opacity="0.15">
    <path d="M256 160L248 60L264 60Z" fill="url(#glow)"/>
    <path d="M220 175L190 80L210 75Z" fill="url(#glow)"/>
    <path d="M292 175L322 80L302 75Z" fill="url(#glow)"/>
    <path d="M190 200L140 120L160 110Z" fill="url(#glow)"/>
    <path d="M322 200L372 120L352 110Z" fill="url(#glow)"/>
  </g>
  <!-- Stylized Noon (ن) bowl — the core mark -->
  <path d="M140 300 Q140 220 200 190 Q230 176 256 176 Q282 176 312 190 Q372 220 372 300"
        stroke="url(#gold)" stroke-width="28" stroke-linecap="round" fill="none"/>
  <!-- The dot (nuqta) of Noon — rendered as a radiant circle -->
  <circle cx="256" cy="148" r="18" fill="url(#gold)"/>
  <circle cx="256" cy="148" r="28" fill="url(#glow)" opacity="0.5"/>
  <!-- Baseline accent -->
  <line x1="120" y1="340" x2="392" y2="340" stroke="#d4a846" stroke-width="2" opacity="0.2"/>
  <!-- Small decorative dots at bowl ends -->
  <circle cx="140" cy="300" r="6" fill="#d4a846" opacity="0.5"/>
  <circle cx="372" cy="300" r="6" fill="#d4a846" opacity="0.5"/>
</svg>
